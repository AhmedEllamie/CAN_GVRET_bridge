; CAN_GVRET_Bridge - GVRET-compatible CAN sniffer for ESP32
; Author: Ahmed Ellamiee <ahmed.ellamiee@gmail.com>
; Copyright (c) 2026 Ahmed Ellamiee
;
; Source layout: headers in include/, implementations in src/ (PlatformIO
; defaults). main.cpp holds setup()/loop() under the Arduino framework.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_extra_dirs = ~/Arduino/libraries

monitor_speed = 921600
upload_speed = 921600
board_build.partitions = min_spiffs.csv

lib_deps =
  fastled/FastLED
  collin80/can_common
  https://github.com/collin80/esp32_can.git
  https://github.com/collin80/esp32_mcp2517fd.git
